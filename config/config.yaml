# =============================================================================
# nano16s — configuration
# =============================================================================
# Every value here can be overridden on the command line:
#   nano16s -d ./fastq_pass --min-quality 12
# Run `nano16s --help` for the full list.

# --- Input / output ---
# Both are normally supplied by the CLI. input_dir is required.
input_dir: ""
output_dir: "results"

# --- Sample discovery ---
# Empty means: auto-detect every barcode* directory inside input_dir.
# Or list them explicitly: ["barcode01", "barcode02", "barcode05"]
samples: []

# --- Read filtering (Chopper) ---
# Full-length 16S is ~1500 bp. The window below keeps near-full-length reads
# and discards fragments and concatemers. Widen it if you are amplifying a
# different region.
min_length: 1000
max_length: 2000
min_quality: 10          # Phred; ~Q10 is a reasonable floor for modern ONT

# --- Emu database ---
# Built by `nano16s db build`. The CLI fills this in from the installed
# database unless you pass --db explicitly.
emu_db: ""

# --- Taxonomic ranks to summarise ---
emu_ranks:
  - species
  - genus
  - phylum

# --- Per-rule resources ---
# Sized for a laptop or workstation, not a cluster. Snakemake caps each rule's
# threads at the total you give with --cores, so these are upper bounds rather
# than reservations: on a 4-core machine nothing here will oversubscribe.
#
# Read them as concurrency, not speed. A rule asking for N threads runs
# floor(cores / N) barcodes at once, so a large value does not make the run
# faster -- it makes fewer barcodes run at a time. None of these stages scales
# well enough for that trade to pay off, which is why the two measured entries
# below are set low.
#
# time_min is unused locally (no scheduler) but is kept so the same rule files
# work unchanged under a cluster profile.
resources:
  merge:
    cpus: 1
    mem_mb: 2000
    time_min: 120
  nanostat:
    cpus: 1
    mem_mb: 2000
    time_min: 60
  porechop:
    # Measured on a 55,000-read barcode: 8 threads returns 3.46x the speed of
    # one, so five of those eight cores do less work than the first two. What
    # matters is barcodes finished per hour, not one barcode's speed, and on
    # the same eight-core budget:
    #
    #   8 jobs x 1 thread   1884 s   1.86x the throughput of the old default
    #   4 jobs x 2 threads  1061 s   1.65x
    #   2 jobs x 4 threads   650 s   1.35x
    #   1 job  x 8 threads   438 s   1.00x   <- what this used to be
    #
    # Fewer threads wins at every step, so the old value was the worst of the
    # four: on any machine with under sixteen cores it ran exactly one barcode
    # at a time. Two rather than one keeps 89% of the gain for less total
    # memory, since a job needs 505 MB at one thread but 731 MB at two or
    # more -- ten concurrent jobs at 7.3 GB rather than twenty at 10.1 GB.
    # mem_mb below is not enforced (nothing passes --resources), so that
    # headroom is the only thing standing between a small machine and the OOM
    # killer.
    cpus: 2
    mem_mb: 8000
    time_min: 240
  chopper:
    # Measured at 0.86-1.14 cores across all five demo runs, on every flow
    # cell size. The stage is `gunzip -c | chopper | gzip`, so it is bound by
    # single-threaded compression, not by chopper's own threading. Reserving
    # four meant three cores sat idle for the length of every chopper job and
    # could not start a Porechop or Emu job waiting behind them.
    cpus: 1
    mem_mb: 2000
    time_min: 60
  emu:
    cpus: 8
    mem_mb: 8000
    time_min: 120
